<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPM Prototypes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ground:    #0d0d12;
      --surface:   #16161f;
      --surface-hi:#1e1e2a;
      --border:    #2a2a38;
      --text:      #e2e2f0;
      --muted:     #8888a8;
      --dim:       #44445a;
      --amber:     #f0b429;
      --amber-dim: #7a5c14;
      --violet:    #a78bfa;
      --violet-dim:#4c3d7a;
      --green:     #34d399;
    }

    html, body {
      background: var(--ground);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .wordmark em { color: var(--amber); font-style: normal; }

    .count-pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    /* ── Hero ── */
    .hero {
      margin-bottom: 64px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ground);
      background: var(--amber);
      border-radius: 3px;
      padding: 3px 8px;
    }

    .hero-slug {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--dim);
    }

    .hero-title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 15px;
      color: var(--muted);
      max-width: 560px;
      margin-bottom: 20px;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--amber);
      text-decoration: none;
      border: 1px solid var(--amber-dim);
      border-radius: 4px;
      padding: 8px 16px;
      margin-bottom: 28px;
      transition: background 120ms, border-color 120ms;
    }
    .hero-cta:hover {
      background: rgba(240,180,41,0.08);
      border-color: var(--amber);
    }

    /* ── Browser Frame ── */
    .browser-frame {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .browser-chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface-hi);
      border-bottom: 1px solid var(--border);
    }

    .browser-dots {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .browser-dots span {
      display: block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border);
    }
    .browser-dots span:nth-child(1) { background: #f87171; }
    .browser-dots span:nth-child(2) { background: #fbbf24; }
    .browser-dots span:nth-child(3) { background: var(--green); }

    .browser-bar {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .browser-viewport {
      position: relative;
      height: 480px;
      overflow: hidden;
      pointer-events: none;
    }

    .browser-viewport iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 960px;
      border: none;
      transform: scale(0.5);
      transform-origin: top left;
    }

    /* fade out bottom to suggest more content */
    .browser-viewport::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, var(--surface));
      pointer-events: none;
    }

    /* ── Archive ── */
    .archive-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 20px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      transition: border-color 120ms, box-shadow 120ms, transform 100ms;
    }
    .card:hover {
      border-color: var(--violet-dim);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }

    .card-preview {
      position: relative;
      height: 160px;
      overflow: hidden;
      background: var(--surface-hi);
      pointer-events: none;
    }

    .card-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 640px;
      border: none;
      transform: scale(0.29);
      transform-origin: top left;
    }

    .card-preview::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--surface-hi));
    }

    .card-info {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-name {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--violet);
    }

    .card-title {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Empty ── */
    .empty { color: var(--dim); font-size: 14px; padding: 32px 0; }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      main { padding: 32px 20px 56px; }
      .browser-viewport { height: 300px; }
      .browser-viewport iframe { width: 900px; height: 600px; transform: scale(0.333); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .hero-cta { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="wordmark">VP<em>M</em> Prototypes</span>
    <span class="count-pill">2 prototypes</span>
  </header>
  <main>
    
    
  <section class="hero">
    <div class="hero-meta">
      <span class="badge">Latest</span>
      <span class="hero-slug">elections-banner-2026</span>
    </div>
    <h1 class="hero-title">VPM 2026 Elections Coverage Banner</h1>
    
    <a class="hero-cta" href="./elections-banner-2026/" target="_blank">Open prototype →</a>
    <div class="browser-frame">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-bar">elections-banner-2026/</div>
      </div>
      <div class="browser-viewport">
        <iframe src="./elections-banner-2026/" loading="lazy" title="VPM 2026 Elections Coverage Banner" scrolling="no"></iframe>
      </div>
    </div>
  </section>
    
  <section class="archive">
    <h2 class="archive-heading">All prototypes</h2>
    <div class="card-grid">
      
      <a class="card" href="./example/" target="_blank">
        <div class="card-preview">
          <iframe src="./example/" loading="lazy" tabindex="-1" title="example" scrolling="no"></iframe>
        </div>
        <div class="card-info">
          <span class="card-name">example</span>
          <span class="card-title"></span>
        </div>
      </a>
    </div>
  </section>
  </main>
</body>
</html>
