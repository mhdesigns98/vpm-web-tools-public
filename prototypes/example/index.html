<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#0E0C0C">

<section class="vpm-a250-hero" aria-label="VPM America 250 Coverage">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;800&family=Barlow+Condensed:wght@700;800;900&display=swap');

    .vpm-a250-hero {
      font-family: 'GT America', 'Barlow', 'Helvetica', 'Arial', sans-serif;
      font-size: 16px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      background: #0E0C0C;
      color: #fff;
      margin-bottom: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .vpm-a250-hero *,
    .vpm-a250-hero *::before,
    .vpm-a250-hero *::after { box-sizing: border-box; }

    .vpm-a250-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        45deg, transparent, transparent 3px,
        rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 6px
      );
      pointer-events: none;
      z-index: 1;
    }

    .vpm-a250-hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #B31C31 0%, #E0E721 100%);
      z-index: 3;
      animation: a250-expand 1.2s ease-out 0.5s both;
    }

    .vpm-a250-wrap {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      align-items: stretch;
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, #0E0C0C 0%, #1A0C0D 45%, #0A0A0A 100%);
    }

    .vpm-a250-image { position: relative; overflow: hidden; opacity: 0; animation: a250-fade-scale 1s ease-out 0.2s forwards; }
    .vpm-a250-image img { width: 100%; height: 100%; min-height: 320px; object-fit: cover; display: block; filter: brightness(0.85) saturate(0.9); }
    .vpm-a250-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, #1A0C0D 100%); pointer-events: none; }

    .vpm-a250-content { position: relative; padding: 52px 56px 60px 44px; overflow: hidden; }

    .vpm-a250-ghost {
      position: absolute; bottom: -0.15em; right: -0.05em;
      font-family: 'GT America', 'Barlow Condensed', 'Barlow', sans-serif;
      font-size: 13em; font-weight: 900; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(176, 28, 49, 0.2);
      letter-spacing: -0.04em;
      pointer-events: none; user-select: none; z-index: 0;
    }

    .vpm-a250-content > *:not(.vpm-a250-ghost) { position: relative; z-index: 1; }

    .vpm-a250-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.75em; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: #B31C31; margin-bottom: 18px;
      opacity: 0; animation: a250-fade-up 0.8s ease-out 0.15s forwards;
    }
    .vpm-a250-eyebrow::before { content: ''; width: 10px; height: 10px; border-top: 2px solid #B31C31; border-left: 2px solid #B31C31; display: block; flex-shrink: 0; }

    .vpm-a250-pre { display: block; font-size: 1em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.55); margin: 0 0 2px; opacity: 0; animation: a250-fade-up 0.8s ease-out 0.25s forwards; }

    .vpm-a250-headline { display: block; font-family: 'GT America', 'Barlow Condensed', 'Barlow', sans-serif; font-size: 3.5em; font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; color: #fff; margin: 0 0 20px; text-shadow: 0 2px 16px rgba(0,0,0,0.5); opacity: 0; animation: a250-fade-up 0.8s ease-out 0.3s forwards; }
    .vpm-a250-headline em { font-style: normal; color: #E0E721; }

    .vpm-a250-hero p { margin: 0 0 28px; font-size: 0.9375em; line-height: 1.65; max-width: 54ch; color: rgba(255,255,255,0.78); opacity: 0; animation: a250-fade-up 0.8s ease-out 0.42s forwards; }

    .vpm-a250-actions { display: flex; gap: 12px; flex-wrap: wrap; opacity: 0; animation: a250-fade-up 0.8s ease-out 0.55s forwards; }

    .vpm-a250-btn { display: inline-flex; align-items: center; text-decoration: none; font-weight: 700; font-size: 0.9375em; letter-spacing: 0.02em; padding: 13px 28px; border-radius: 2px; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden; }

    .vpm-a250-btn.primary { background: #B31C31; color: #fff; box-shadow: 0 4px 14px rgba(179,28,49,0.4); border: none; }
    .vpm-a250-btn.primary::before { content: ''; position: absolute; inset: 0; background: #E0E721; opacity: 0; transition: opacity 0.25s ease; }
    .vpm-a250-btn.primary span { position: relative; z-index: 1; transition: color 0.25s ease; }
    .vpm-a250-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(179,28,49,0.5); }
    .vpm-a250-btn.primary:hover::before { opacity: 1; }
    .vpm-a250-btn.primary:hover span { color: #0E0C0C; }

    .vpm-a250-btn.secondary { background: transparent; color: rgba(255,255,255,0.75); border: 1.5px solid rgba(255,255,255,0.25); }
    .vpm-a250-btn.secondary:hover { border-color: #E0E721; color: #E0E721; }

    @keyframes a250-fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes a250-fade-scale { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: scale(1); } }
    @keyframes a250-expand { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }

    @media (max-width: 860px) {
      .vpm-a250-wrap { grid-template-columns: 1fr; }
      .vpm-a250-image img { min-height: 240px; height: 240px; }
      .vpm-a250-image::after { background: linear-gradient(180deg, transparent 60%, #1A0C0D 100%); }
      .vpm-a250-content { padding: 36px 28px 44px; }
      .vpm-a250-headline { font-size: 2.75em; }
      .vpm-a250-ghost { font-size: 9em; }
    }

    @media (max-width: 480px) {
      .vpm-a250-content { padding: 28px 20px 36px; }
      .vpm-a250-headline { font-size: 2.25em; }
      .vpm-a250-ghost { font-size: 6em; }
      .vpm-a250-actions { flex-direction: column; align-items: flex-start; }
      .vpm-a250-btn { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .vpm-a250-hero *, .vpm-a250-hero::after { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>

  <div class="vpm-a250-wrap">
    <div class="vpm-a250-image">
      <img src="https://assets.vpm.org/5a/7f/f431b98d4786bb64a3d83028bf8e/tinywow-img-7058-89136118.jpg" alt="VPM America 250 coverage" loading="eager" />
    </div>
    <div class="vpm-a250-content">
      <div class="vpm-a250-ghost" aria-hidden="true">250</div>
      <div class="vpm-a250-eyebrow">VPM Special Coverage</div>
      <span class="vpm-a250-pre">America</span>
      <strong class="vpm-a250-headline">At <em>250</em></strong>
      <p>Virginia was here at the beginning. VPM's ongoing coverage of America's semiquincentennial explores what 250 years of history means — from Jamestown to today.</p>
      <div class="vpm-a250-actions">
        <a class="vpm-a250-btn primary" href="#" aria-label="Explore VPM's America 250 coverage"><span>Explore Coverage</span></a>
        <a class="vpm-a250-btn secondary" href="#"><span>About the Series</span></a>
      </div>
    </div>
  </div>
</section>

</body>
</html>
