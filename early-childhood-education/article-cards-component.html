<!--
  VPM Article Cards Component - Shadow DOM Web Component
  ======================================================

  PURPOSE
  -------
  Reusable 3x2 grid of internal VPM news articles for Early Childhood pages.
  Intended to be driven by a single Brightspot tag (e.g., "announcements")
  and link through to that tag page.

  CUSTOM ELEMENT
  --------------
  <vpm-article-cards></vpm-article-cards>

  REQUIRED/OPTIONAL ATTRIBUTES
  ----------------------------
  - data-tag-slug      : Brightspot tag slug (e.g., "announcements").
  - data-tag-url       : URL of the tag page (e.g., "https://www.vpm.org/tags/announcements").
  - data-section-title : Optional section heading (e.g., "Latest Announcements").
  - data-section-subtitle : Optional short description under the heading.

  DATA FEED (FOR BRIGHTSPOT INTEGRATION)
  --------------------------------------
  This file ships with mock data so it works standalone. In production,
  Brightspot should provide real article metadata in one of these ways:

  1) Global JS variable (simplest)
     <script>
       window.vpmArticleCardsFeed = [
         {
           title: "Article title",
           description: "Short teaser up to ~140 characters.",
           imageUrl: "https://assets.vpm.org/...",
           sectionTitle: "Announcements",
           url: "https://www.vpm.org/...",
           publishDate: "2025-12-12T10:00:00Z"
         },
         ...
       ];
     </script>

  2) Inline JSON script (safer, avoids global namespace)
     <script type="application/json" id="vpm-article-cards-data">
       [
         {
           "title": "Article title",
           "description": "Short teaser up to ~140 characters.",
           "imageUrl": "https://assets.vpm.org/...",
           "sectionTitle": "Announcements",
           "url": "https://www.vpm.org/...",
           "publishDate": "2025-12-12T10:00:00Z"
         }
       ]
     </script>

  The component will:
    - Prefer inline JSON (#vpm-article-cards-data) if present
    - Otherwise use window.vpmArticleCardsFeed if present
    - Otherwise fall back to built-in mock examples

  EXPECTED ARTICLE FIELDS
  -----------------------
  {
    title: string,
    description: string,
    imageUrl: string,
    sectionTitle: string,  // e.g. "Announcements" or parent section
    url: string,
    publishDate: string    // ISO date string, used to sort newest first
  }

  DISPLAY RULES
  -------------
  - Shows up to 6 most recent articles (sorted by publishDate desc).
  - Layout: 3 columns on large screens, 2 on medium, 1 on small.
  - After the 6 cards, shows a centered button linking to data-tag-url:
      "View all [Tag Name]"
    where Tag Name is derived from sectionTitle or data-tag-slug.
-->

<template id="vpm-article-cards-template">
  <style>
    /* Cards section — Shadow DOM isolated styles, token-aware */
    :host {
      display: block;
      color: inherit;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .cards-section {
      max-width: 1200px;
      margin-inline: auto;
      padding: clamp(2.5rem, 5vw, 4rem) clamp(1rem, 3vw, 2rem);
    }

    .cards-header {
      text-align: center;
      margin-bottom: clamp(2rem, 4vw, 3rem);
    }

    .cards-title {
      color: var(--cardsTitleColor, var(--primaryColor1, #003865));
      font-weight: 700;
      /* Match site heading scale (falls back to reasonable size if tokens missing) */
      font-size: var(--title-3, 3.2rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .cards-subtitle {
      color: var(--secC1, #6d6f6d);
      /* Use body text token for consistency with main site copy */
      font-size: var(--body-2, 1.1rem);
      margin-top: 0.75rem;
      margin-bottom: 0;
      line-height: 1.6;
      max-width: 60ch;
      margin-inline: auto;
      font-weight: 500;
    }

    .cards-grid {
      display: grid;
      gap: clamp(1rem, 2vw, 1.5rem);
      overflow: visible;
      margin-bottom: clamp(2rem, 3vw, 2.5rem);
    }

    @media (min-width: 640px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .card {
      color: inherit;
      display: block;
      text-decoration: none;
      overflow: visible;
    }

    .card-inner {
      background: #ffffff;
      border-radius: var(--radiusLg, 12px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin: 6px;
      will-change: transform;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card:focus-visible .card-inner,
    .card:hover .card-inner {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--shadowElev, 0 8px 20px rgba(0, 0, 0, 0.15));
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner {
        transition: none;
      }
      .card:focus-visible .card-inner,
      .card:hover .card-inner {
        transform: none;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .card-panel {
      position: relative;
      padding: clamp(1rem, 1.8vw, 1.25rem);
      color: var(--fg, #101820);
      border-top: 2px solid var(--border, #e5e7eb);
      text-align: left;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-weight: 600;
      font-size: var(--label-2, 0.95rem);
      background: color-mix(in oklab, var(--border, #6cace4) 20%, transparent);
      color: var(--fg, #003865);
      margin-bottom: 0.5rem;
    }

    @supports not (color: color-mix(in oklab, red, blue)) {
      .card-pill {
        background: rgba(108, 172, 228, 0.2);
      }
    }

    .card-title {
      margin: 0.25rem 0 0;
      font-weight: 800;
      letter-spacing: -0.015em;
      /* Map to card/title level from site scale */
      font-size: var(--title-6, 1.6rem);
      line-height: 1.3;
    }

    .card-text {
      margin-top: 0.6rem;
      margin-bottom: 0;
      font-size: var(--body-2, 1.05rem);
      line-height: 1.6;
      color: var(--secC1, #4b5563);
    }

    .card-meta {
      margin-top: 0.75rem;
      font-size: var(--label-2, 0.95rem);
      color: var(--secC1, #6b7280);
    }

    .cards-footer {
      text-align: center;
    }

    .tag-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      background: var(--primaryColor1, #003865);
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: var(--label-1, 1.05rem);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .tag-button:hover,
    .tag-button:focus-visible {
      background: #005499;
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .tag-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .tag-button-icon {
      font-size: 1.05em;
    }
  </style>

  <section class="cards-section" aria-labelledby="vpm-article-cards-title">
    <header class="cards-header">
      <h2 id="vpm-article-cards-title" class="cards-title"></h2>
      <p class="cards-subtitle"></p>
    </header>

    <div class="cards-grid" data-equalize-panels="true" role="list"></div>

    <div class="cards-footer">
      <a class="tag-button" href="#" target="" rel="" aria-label="">
        <span class="tag-button-label"></span>
        <span class="tag-button-icon" aria-hidden="true">→</span>
      </a>
    </div>
  </section>
</template>

<script>
  class VpmArticleCards extends HTMLElement {
    constructor() {
      super();
      const shadow = this.attachShadow({ mode: 'open' });
      const template = document.getElementById('vpm-article-cards-template');

      if (!template) {
        console.error('VPM Article Cards: Template not found. Make sure the template element is included.');
        return;
      }

      shadow.appendChild(template.content.cloneNode(true));

      this.shadowRootRef = shadow;
    }

    connectedCallback() {
      this.render();
    }

    getAttributeOr(defaultValue, attr) {
      const v = this.getAttribute(attr);
      return (v && v.trim().length > 0) ? v.trim() : defaultValue;
    }

    deriveTagLabel(tagSlug) {
      if (!tagSlug) return 'stories';
      return tagSlug
        .split('-')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    parseArticlesFromInlineJson() {
      try {
        const scriptEl = document.getElementById('vpm-article-cards-data');
        if (!scriptEl || scriptEl.type !== 'application/json') return null;
        const text = scriptEl.textContent || '';
        if (!text.trim()) return null;
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) return null;
        return parsed;
      } catch (e) {
        console.warn('VPM Article Cards: Failed to parse inline JSON data.', e);
        return null;
      }
    }

    getFeedArticles() {
      // 1) Inline JSON script
      const inline = this.parseArticlesFromInlineJson();
      if (inline && inline.length) return inline;

      // 2) Global window variable
      if (window && Array.isArray(window.vpmArticleCardsFeed)) {
        return window.vpmArticleCardsFeed;
      }

      // 3) Built-in mock data for demos
      return this.getMockArticles();
    }

    getMockArticles() {
      // Simple mock data set for local demos / Storybook-style previews.
      return [
        {
          title: '“The People Issue” highlights community changemakers',
          description: 'Explore stories of educators, caregivers and young learners making a difference in Central Virginia.',
          imageUrl: 'https://assets.vpm.org/4c/06/4acc354148fc8ef576beb28487f7/20250128-ga-scene-sa-1355.jpg',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-12-12T10:00:00Z'
        },
        {
          title: 'Scenes from the 2025 Dominion Energy Christmas Parade',
          description: 'See how VPM brought early childhood learning moments to the parade route this year.',
          imageUrl: 'https://assets.vpm.org/20/6f/9889f7ad2493c14f9867b93d7a97/pumpkin-patch-kids.jpg',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-12-11T10:00:00Z'
        },
        {
          title: 'Career Day, concerts and podcasts mark VPM’s community engagement',
          description: 'From classrooms to community stages, VPM is connecting families with quality learning experiences.',
          imageUrl: 'https://assets.vpm.org/a0/cd/7a61e840437c2c86951c67d8666f/kp-handsup.jpg',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-12-04T10:00:00Z'
        },
        {
          title: 'Remembering former VPM President & CEO Charlie Sydnor',
          description: 'Reflect on the impact of a leader who helped expand educational programming for Virginia families.',
          imageUrl: 'https://assets.vpm.org/ff/db/be8b0b511d6c0bfea8f9c6dcfec9/scdc-classroom-kids-01.jpg',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-12-04T09:00:00Z'
        },
        {
          title: 'VPM welcomes local media for tour of new headquarters',
          description: 'Take a look inside VPM’s new home and what it means for local education and storytelling.',
          imageUrl: 'https://assets.vpm.org/a2/92/b909d3fe4d399ef40a28da8824b6/tcc-childcare-040.JPG',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-11-21T10:00:00Z'
        },
        {
          title: 'Scenes from the 2025 RESONATE Podcast Festival',
          description: 'Young listeners and families discovered new stories and voices at this year’s festival.',
          imageUrl: 'https://assets.vpm.org/6e/05/369457374c979e0d8c20bf79674b/ms7.jpg',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-11-13T10:00:00Z'
        },
        {
          title: 'Festivals headline VPM’s October 2025 community engagement',
          description: 'From fall festivals to family resource fairs, VPM shows up where kids learn and play.',
          imageUrl: 'https://picsum.photos/800/450?random=12',
          sectionTitle: 'Announcements',
          url: 'https://www.vpm.org/tags/announcements',
          publishDate: '2025-10-30T10:00:00Z'
        }
      ];
    }

    normalizeArticle(a) {
      if (!a || typeof a !== 'object') return null;
      const title = (a.title || '').toString().trim();
      const url = (a.url || '').toString().trim();
      if (!title || !url) return null;

      const description = (a.description || '').toString().trim();
      const imageUrl = (a.imageUrl || '').toString().trim();
      const sectionTitle = (a.sectionTitle || '').toString().trim();
      const publishDate = a.publishDate || '';

      return { title, url, description, imageUrl, sectionTitle, publishDate };
    }

    render() {
      const shadow = this.shadowRootRef;
      if (!shadow) return;

      const sectionTitleEl = shadow.querySelector('.cards-title');
      const sectionSubtitleEl = shadow.querySelector('.cards-subtitle');
      const gridEl = shadow.querySelector('.cards-grid');
      const buttonEl = shadow.querySelector('.tag-button');
      const buttonLabelEl = shadow.querySelector('.tag-button-label');

      const tagSlug = this.getAttributeOr('announcements', 'data-tag-slug');
      const tagUrl = this.getAttributeOr('https://www.vpm.org/tags/announcements', 'data-tag-url');
      const sectionTitle = this.getAttributeOr('Latest stories', 'data-section-title');
      const sectionSubtitle = this.getAttributeOr('News and updates from VPM Early Childhood.', 'data-section-subtitle');

      const tagLabel = this.deriveTagLabel(tagSlug);

      if (sectionTitleEl) sectionTitleEl.textContent = sectionTitle;
      if (sectionSubtitleEl) sectionSubtitleEl.textContent = sectionSubtitle;

      if (buttonEl && buttonLabelEl) {
        buttonEl.href = tagUrl;
        buttonEl.target = '_self';
        buttonEl.rel = '';
        const btnText = `View all ${tagLabel}`;
        buttonLabelEl.textContent = btnText;
        buttonEl.setAttribute('aria-label', `${btnText} stories on VPM.org`);
      }

      if (!gridEl) return;
      gridEl.innerHTML = '';

      const rawArticles = this.getFeedArticles() || [];
      const normalized = rawArticles
        .map(a => this.normalizeArticle(a))
        .filter(Boolean);

      normalized.sort((a, b) => {
        const da = Date.parse(a.publishDate || '') || 0;
        const db = Date.parse(b.publishDate || '') || 0;
        return db - da;
      });

      const topSix = normalized.slice(0, 6);

      topSix.forEach((article, index) => {
        const item = this.createCard(article, index);
        if (item) gridEl.appendChild(item);
      });
    }

    createCard(article, index) {
      const shadow = this.shadowRootRef;
      if (!shadow) return null;

      const articleEl = document.createElement('article');
      articleEl.className = 'card';
      articleEl.setAttribute('role', 'listitem');

      const linkEl = document.createElement('a');
      linkEl.href = article.url;
      linkEl.className = 'card';
      linkEl.setAttribute('aria-label', article.title);

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      if (article.imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-img';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = article.imageUrl;
        img.alt = article.title;
        inner.appendChild(img);
      }

      const panel = document.createElement('div');
      panel.className = 'card-panel';
      panel.style.setProperty('--border', '#6CACE4');
      panel.style.setProperty('--fg', '#003865');

      if (article.sectionTitle) {
        const pill = document.createElement('span');
        pill.className = 'card-pill';
        pill.textContent = article.sectionTitle;
        panel.appendChild(pill);
      }

      const titleEl = document.createElement('h3');
      titleEl.className = 'card-title';
      titleEl.textContent = article.title;
      panel.appendChild(titleEl);

      if (article.description) {
        const textEl = document.createElement('p');
        textEl.className = 'card-text';
        textEl.textContent = article.description;
        panel.appendChild(textEl);
      }

      if (article.publishDate) {
        const date = new Date(article.publishDate);
        if (!isNaN(date)) {
          const metaEl = document.createElement('p');
          metaEl.className = 'card-meta';
          metaEl.textContent = date.toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
          panel.appendChild(metaEl);
        }
      }

      inner.appendChild(panel);
      linkEl.appendChild(inner);
      articleEl.appendChild(linkEl);
      return articleEl;
    }
  }

  if (!customElements.get('vpm-article-cards')) {
    customElements.define('vpm-article-cards', VpmArticleCards);
  }
</script>
