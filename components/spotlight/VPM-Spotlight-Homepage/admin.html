<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VPM Spotlight Admin - Manage Content Queue">
  <title>VPM Spotlight Admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .admin-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }

    .admin-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 0.5rem;
    }

    .admin-subtitle {
      color: var(--muted-foreground);
    }

    .admin-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background-color: var(--vpm-red);
      color: #ffffff;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: var(--muted);
      color: var(--foreground);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-success {
      background-color: #10b981;
      color: #ffffff;
    }

    .btn-success:hover {
      opacity: 0.9;
    }

    .form-section {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--foreground);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-family: inherit;
      background-color: var(--background);
      color: var(--foreground);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: 2px solid var(--vpm-red);
      outline-offset: 2px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .item-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      position: relative;
    }

    .item-card.active {
      border-color: var(--vpm-red);
      border-width: 2px;
    }

    .item-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .item-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--foreground);
      margin-bottom: 0.25rem;
    }

    .item-card-subtitle {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-bottom: 0.5rem;
    }

    .item-card-description {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .item-card-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 0.25rem;
      margin-bottom: 0.75rem;
    }

    .item-card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .item-card-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background-color: var(--vpm-red);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }

    .status-indicator.active {
      background-color: var(--vpm-red);
    }

    .status-indicator.inactive {
      background-color: var(--muted-foreground);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted-foreground);
    }

    @media (max-width: 768px) {
      .items-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1 class="admin-title">VPM Spotlight Admin</h1>
      <p class="admin-subtitle">Manage content queue and high priority items</p>
    </div>

    <div class="admin-actions">
      <button class="btn btn-primary" onclick="showAddForm()">Add New Item</button>
      <button class="btn btn-secondary" onclick="loadItems()">Refresh List</button>
      <button class="btn btn-success" onclick="exportJSON()">Export JSON</button>
    </div>

    <!-- Add/Edit Form -->
    <div id="add-form" class="form-section" style="display: none;">
      <h2 class="form-title" id="form-title">Add New Content Item</h2>
      <form id="content-form" onsubmit="handleSubmit(event)">
        <input type="hidden" id="item-id" name="id">
        
        <div class="form-group">
          <label class="form-label" for="picture">Picture URL *</label>
          <input type="url" id="picture" name="picture" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="title">Title *</label>
          <input type="text" id="title" name="title" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="subtitle">Subtitle</label>
          <input type="text" id="subtitle" name="subtitle" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description *</label>
          <textarea id="description" name="description" class="form-textarea" required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="link">Link URL</label>
          <input type="url" id="link" name="link" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">
            <input type="checkbox" id="high-priority" name="highPriority">
            Mark as High Priority (will display in spotlight)
          </label>
        </div>

        <div class="admin-actions">
          <button type="submit" class="btn btn-primary">Save Item</button>
          <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Items List -->
    <div class="form-section">
      <h2 class="form-title">Content Items</h2>
      <p style="color: var(--muted-foreground); margin-bottom: 1rem;">
        <span class="status-indicator active"></span>Active items (displayed in spotlight)
      </p>
      <div id="items-list" class="items-grid">
        <!-- Items will be dynamically inserted here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let allItems = [];
    let editingItemId = null;

    // Load items on page load
    document.addEventListener('DOMContentLoaded', async () => {
      await loadItems();
    });

    // Load items from JSON
    async function loadItems() {
      try {
        const response = await fetch('content-queue.json');
        if (!response.ok) {
          throw new Error('Failed to load content queue');
        }
        const data = await response.json();
        allItems = data.items || [];
        
        if (window.SpotlightQueue) {
          window.SpotlightQueue.setContentData(allItems);
        }
        
        renderItems();
      } catch (error) {
        console.error('Error loading items:', error);
        document.getElementById('items-list').innerHTML = 
          '<div class="empty-state"><p>Unable to load items. Please check the content-queue.json file.</p></div>';
      }
    }

    // Render items list
    function renderItems() {
      const container = document.getElementById('items-list');
      
      if (allItems.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No items in queue. Add your first item to get started.</p></div>';
        return;
      }

      // Sort: active items first, then by date
      const sortedItems = [...allItems].sort((a, b) => {
        const aActive = a.tags && a.tags.includes('high priority');
        const bActive = b.tags && b.tags.includes('high priority');
        if (aActive && !bActive) return -1;
        if (!aActive && bActive) return 1;
        return new Date(b.dateAdded) - new Date(a.dateAdded);
      });

      container.innerHTML = sortedItems.map(item => {
        const isActive = item.tags && item.tags.includes('high priority');
        return `
          <div class="item-card ${isActive ? 'active' : ''}" data-id="${item.id}">
            ${isActive ? '<span class="item-card-badge">ACTIVE</span>' : ''}
            <img src="${item.picture || ''}" alt="${item.title || ''}" class="item-card-image" onerror="this.style.display='none'">
            <div class="item-card-header">
              <div>
                <div class="item-card-title">${item.title || 'Untitled'}</div>
                <div class="item-card-subtitle">${item.subtitle || ''}</div>
              </div>
            </div>
            <div class="item-card-description">${item.description || ''}</div>
            <div class="item-card-actions">
              <button class="btn btn-sm ${isActive ? 'btn-secondary' : 'btn-success'}" onclick="togglePriority('${item.id}')">
                ${isActive ? 'Remove from Spotlight' : 'Add to Spotlight'}
              </button>
              <button class="btn btn-sm btn-secondary" onclick="editItem('${item.id}')">Edit</button>
              <button class="btn btn-sm btn-secondary" onclick="deleteItem('${item.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Show add form
    function showAddForm() {
      editingItemId = null;
      document.getElementById('add-form').style.display = 'block';
      document.getElementById('form-title').textContent = 'Add New Content Item';
      document.getElementById('content-form').reset();
      document.getElementById('item-id').value = '';
      document.getElementById('add-form').scrollIntoView({ behavior: 'smooth' });
    }

    // Hide add form
    function hideAddForm() {
      document.getElementById('add-form').style.display = 'none';
      editingItemId = null;
    }

    // Handle form submit
    function handleSubmit(event) {
      event.preventDefault();
      
      const formData = new FormData(event.target);
      const item = {
        id: formData.get('id') || Date.now().toString(),
        picture: formData.get('picture'),
        title: formData.get('title'),
        subtitle: formData.get('subtitle') || '',
        description: formData.get('description'),
        link: formData.get('link') || '#',
        tags: formData.get('highPriority') ? ['high priority'] : [],
        dateAdded: formData.get('id') ? 
          (allItems.find(i => i.id === formData.get('id'))?.dateAdded || new Date().toISOString()) :
          new Date().toISOString()
      };

      if (editingItemId) {
        // Update existing item
        const index = allItems.findIndex(i => i.id === editingItemId);
        if (index !== -1) {
          allItems[index] = item;
        }
      } else {
        // Add new item
        allItems.push(item);
      }

      // If marking as high priority, manage queue
      if (item.tags.includes('high priority')) {
        const highPriorityItems = allItems.filter(i => 
          i.tags && i.tags.includes('high priority')
        ).sort((a, b) => new Date(a.dateAdded) - new Date(b.dateAdded));

        if (highPriorityItems.length > 3) {
          const oldestItem = highPriorityItems[0];
          if (oldestItem.id !== item.id) {
            oldestItem.tags = oldestItem.tags.filter(tag => tag !== 'high priority');
          }
        }
      }

      if (window.SpotlightQueue) {
        window.SpotlightQueue.setContentData(allItems);
      }

      renderItems();
      hideAddForm();
    }

    // Edit item
    function editItem(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) return;

      editingItemId = id;
      document.getElementById('item-id').value = item.id;
      document.getElementById('picture').value = item.picture || '';
      document.getElementById('title').value = item.title || '';
      document.getElementById('subtitle').value = item.subtitle || '';
      document.getElementById('description').value = item.description || '';
      document.getElementById('link').value = item.link || '';
      document.getElementById('high-priority').checked = 
        item.tags && item.tags.includes('high priority');

      document.getElementById('form-title').textContent = 'Edit Content Item';
      document.getElementById('add-form').style.display = 'block';
      document.getElementById('add-form').scrollIntoView({ behavior: 'smooth' });
    }

    // Toggle priority
    function togglePriority(id) {
      if (window.SpotlightQueue) {
        window.SpotlightQueue.toggleHighPriorityTag(id);
        loadItems(); // Reload to reflect changes
      }
    }

    // Delete item
    function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this item?')) {
        return;
      }

      allItems = allItems.filter(i => i.id !== id);
      
      if (window.SpotlightQueue) {
        window.SpotlightQueue.setContentData(allItems);
      }

      renderItems();
    }

    // Export JSON
    function exportJSON() {
      const json = JSON.stringify({ items: allItems }, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'content-queue.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
