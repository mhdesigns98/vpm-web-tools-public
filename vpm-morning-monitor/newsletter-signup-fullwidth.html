<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPM Morning Monitor Newsletter Signup</title>
</head>
<body style="margin: 0; padding: 20px; background: #ffffff; font-family: Arial, sans-serif;">

<div id="vpm-newsletter-signup">
  <style>
    /* Base reset */
    #vpm-newsletter-signup {
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }
    #vpm-newsletter-signup * {
      box-sizing: inherit;
    }

    /* Full-width background container */
    #vpm-newsletter-signup .vpm-form-wrapper {
      width: 100%;
      padding: 40px 20px;
      position: relative;
    }

    /* Main form container (content block) */
    #vpm-newsletter-signup .vpm-form-body {
      max-width: 1200px;
      margin: 0 auto;
      background:
        linear-gradient(135deg, rgba(26, 84, 144, 0.95) 0%, rgba(13, 58, 107, 0.95) 100%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 35px,
          rgba(255, 255, 255, 0.02) 35px,
          rgba(255, 255, 255, 0.02) 70px
        ),
        radial-gradient(circle at 20% 50%, rgba(212, 225, 87, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      border: 6px solid #d4e157;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 50px 60px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle geometric pattern overlay */
    #vpm-newsletter-signup .vpm-form-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(30deg, transparent 48%, rgba(212, 225, 87, 0.03) 49%, rgba(212, 225, 87, 0.03) 51%, transparent 52%),
        linear-gradient(150deg, transparent 48%, rgba(255, 255, 255, 0.02) 49%, rgba(255, 255, 255, 0.02) 51%, transparent 52%);
      background-size: 80px 80px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Accent corner element */
    #vpm-newsletter-signup .vpm-form-body::after {
      content: '';
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 60px 60px;
      border-color: transparent transparent #d4e157 transparent;
      z-index: 1;
    }

    /* Ensure content stays above decorative elements */
    #vpm-newsletter-signup .vpm-form-body > * {
      position: relative;
      z-index: 1;
    }

    /* Header image styling: centered and constrained */
    #vpm-newsletter-signup .vpm-form-header {
      max-width: 400px;
      margin: 0 auto 30px;
    }
    #vpm-newsletter-signup .vpm-form-header img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* Headline styling */
    #vpm-newsletter-signup h3 {
      color: #ffffff;
      font-size: 28px;
      line-height: 1.3;
      margin: 0 auto 30px;
      max-width: 800px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #vpm-newsletter-signup h3 .highlight {
      color: #d4e157;
      font-style: italic;
      display: inline-block;
    }

    /* Form grid layout for larger screens */
    #vpm-newsletter-signup .vpm-form-content {
      max-width: 800px;
      margin: 0 auto;
    }

    #vpm-newsletter-signup .vpm-form-fields {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    /* Input field styling */
    #vpm-newsletter-signup .vpm-field-group {
      flex: 1;
      min-width: 0;
    }

    #vpm-newsletter-signup label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      text-align: left;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    #vpm-newsletter-signup input[type="email"] {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      height: 54px;
      background: #ffffff;
      color: #1a1a1a;
    }

    #vpm-newsletter-signup input[type="email"]:focus {
      outline: none;
      border-color: #d4e157;
      box-shadow: 0 0 0 3px rgba(212, 225, 87, 0.2);
      background: #ffffff;
    }

    #vpm-newsletter-signup input[type="email"]::placeholder {
      color: #666;
      opacity: 1;
    }

    /* Subscribe button styling */
    #vpm-newsletter-signup .vpm-submit {
      flex-shrink: 0;
    }

    #vpm-newsletter-signup .vpm-submit label {
      margin-bottom: 0;
      height: 0;
      overflow: hidden;
    }

    #vpm-newsletter-signup input[type="submit"] {
      background: #d4e157;
      color: #1a1a1a;
      border: 2px solid #1a1a1a;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      height: 54px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
    }

    #vpm-newsletter-signup input[type="submit"]:hover {
      background: #c0ca33;
      border-color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    #vpm-newsletter-signup input[type="submit"]:active {
      transform: translateY(0);
    }

    #vpm-newsletter-signup input[type="submit"]:focus {
      outline: 3px solid #d4e157;
      outline-offset: 2px;
    }

    /* Secondary link styling */
    #vpm-newsletter-signup .vpm-explore-link {
      margin-top: 20px;
      font-size: 16px;
      text-align: center;
    }

    #vpm-newsletter-signup .vpm-explore-link a {
      color: #d4e157;
      text-decoration: underline;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    #vpm-newsletter-signup .vpm-explore-link a:hover {
      background-color: rgba(212, 225, 87, 0.1);
      color: #c0ca33;
    }

    #vpm-newsletter-signup .vpm-explore-link a:focus {
      outline: 2px solid #d4e157;
      outline-offset: 2px;
    }

    /* Response message styling */
    #vpm-newsletter-signup .vpm-response {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
    }

    #vpm-newsletter-signup .vpm-error-response {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      display: none;
    }

    #vpm-newsletter-signup .vpm-success-response {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #81c784;
      display: none;
    }

    /* Screen reader only text */
    #vpm-newsletter-signup .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Responsive adjustments */
    @media screen and (max-width: 767px) {
      #vpm-newsletter-signup .vpm-form-wrapper {
        padding: 30px 15px;
      }

      #vpm-newsletter-signup .vpm-form-body {
        padding: 40px 25px;
        border-width: 5px;
      }

      #vpm-newsletter-signup .vpm-form-header {
        max-width: 350px;
        margin-bottom: 25px;
      }

      #vpm-newsletter-signup h3 {
        font-size: 24px;
        margin-bottom: 25px;
      }

      #vpm-newsletter-signup .vpm-form-fields {
        flex-direction: column;
        gap: 15px;
      }

      #vpm-newsletter-signup input[type="email"] {
        height: 56px;
        font-size: 16px;
        padding: 16px;
      }

      #vpm-newsletter-signup input[type="submit"] {
        width: 100%;
        padding: 18px 32px;
        font-size: 18px;
        height: 56px;
      }

      #vpm-newsletter-signup .vpm-form-body::after {
        border-width: 0 0 50px 50px;
      }
    }

    @media screen and (max-width: 479px) {
      #vpm-newsletter-signup .vpm-form-wrapper {
        padding: 20px 10px;
      }

      #vpm-newsletter-signup .vpm-form-body {
        padding: 35px 20px;
        border-width: 4px;
        border-radius: 10px;
      }

      #vpm-newsletter-signup .vpm-form-header {
        max-width: 300px;
        margin-bottom: 20px;
      }

      #vpm-newsletter-signup h3 {
        font-size: 20px;
        margin-bottom: 20px;
        letter-spacing: 0.3px;
        line-height: 1.4;
      }

      #vpm-newsletter-signup label {
        font-size: 15px;
        margin-bottom: 10px;
      }

      #vpm-newsletter-signup input[type="email"] {
        height: 54px;
        font-size: 16px;
        padding: 16px;
      }

      #vpm-newsletter-signup input[type="submit"] {
        padding: 17px 28px;
        font-size: 17px;
        height: 54px;
        letter-spacing: 0.8px;
      }

      #vpm-newsletter-signup .vpm-form-body::before {
        background-size: 60px 60px;
      }

      #vpm-newsletter-signup .vpm-form-body::after {
        border-width: 0 0 40px 40px;
      }

      #vpm-newsletter-signup .vpm-explore-link {
        font-size: 15px;
        margin-top: 18px;
      }
    }

    /* High contrast mode support */
    @media (prefers-contrast: high) {
      #vpm-newsletter-signup .vpm-form-body {
        border: 2px solid #000;
      }

      #vpm-newsletter-signup input[type="email"] {
        border: 2px solid #000;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      #vpm-newsletter-signup * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <div class="vpm-form-wrapper">
    <div class="vpm-form-body">
      <div class="vpm-form-header">
        <img src="https://assets.vpm.org/42/0a/e860df4a4251b9004653422ee642/vpm-mm-newsletter-header-150x-100.jpg" alt="VPM News Morning Monitor newsletter logo">
      </div>

      <div class="vpm-form-content">
        <h3><span class="highlight">Your Morning</span> Starts Here. Stay informed on news you care about.</h3>

        <form action="https://vpm.us3.list-manage.com/subscribe/post?u=6fe41b3055c403be08140ec95&id=26497cf3ad&f_id=0016c9e1f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate>
          <div class="vpm-form-fields">
            <div class="vpm-field-group">
              <label for="mce-EMAIL">
                Email Address
                <span aria-hidden="true">*</span>
                <span class="sr-only">(required)</span>
              </label>
              <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required placeholder="your.email@example.com" aria-required="true" aria-describedby="email-description">
              <span id="email-description" class="sr-only">Enter your email address to subscribe to the Morning Monitor newsletter</span>
            </div>

            <div class="vpm-submit">
              <label class="sr-only" for="mc-embedded-subscribe">Submit subscription</label>
              <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
            </div>
          </div>

          <div hidden>
            <input type="hidden" name="tags" value="1620245,1620261">
          </div>

          <div class="vpm-response vpm-error-response" id="mce-error-response" role="alert" aria-live="polite"></div>
          <div class="vpm-response vpm-success-response" id="mce-success-response" role="alert" aria-live="polite"></div>

          <div aria-hidden="true" style="position: absolute; left: -5000px;">
            <input type="text" name="b_6fe41b3055c403be08140ec95_26497cf3ad" tabindex="-1" value="">
          </div>

          <div class="vpm-explore-link">
            <a href="https://www.vpm.org/stay-connected-to-what-matters">Explore More Newsletters</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
